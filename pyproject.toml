[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-mamba2"
version = "2.0.0"
description = "Motion Mamba 2.0: reproducible G1 motion modeling, training and paired-text evaluation"
readme = "README.MD"
requires-python = ">=3.11"
license = {text = "Apache-2.0; see third_party notices for upstream components"}
authors = [{name = "Motion Mamba 2.0 contributors"}]
dependencies = ["numpy>=2,<3", "scipy>=1.10", "torch>=2.6", "einops>=0.7", "hydra-core>=1.3", "omegaconf>=2.3", "pydantic>=2", "safetensors>=0.4", "transformers==5.8.1", "peft>=0.19", "gradio-client>=2", "huggingface-hub>=1", "PyYAML>=6", "tqdm>=4", "packaging>=21", "vector-quantize-pytorch>=1.25,<1.26"]

[project.optional-dependencies]
text = ["transformers==5.8.1", "peft>=0.19", "gradio-client>=2"]
test = ["pytest>=8"]
visualization = ["matplotlib>=3.8", "mujoco>=3", "trimesh>=4"]

[tool.setuptools.packages.find]
where = ["src", "training", "data", "evaluation"]
include = ["motion_mamba2*", "motion_training*", "motion_data*", "native_eval*"]

[tool.setuptools.package-data]
motion_mamba2 = ["assets/skeletons/**/*"]
